<script>
(function(){
  function drawLines(){
    var map=document.getElementById('tvLangMap');
    var lines=document.getElementById('tvLangLines');
    var center=document.getElementById('tvLangCenter');
    if(!map||!lines||!center)return;
    var mr=map.getBoundingClientRect();
    var cr=center.getBoundingClientRect();
    var cx=cr.left-mr.left+cr.width/2;
    var cy=cr.top-mr.top+cr.height/2;
    lines.setAttribute('viewBox','0 0 '+mr.width+' '+mr.height);
    var nodes=map.querySelectorAll('.tv-lang-node');
    var paths='';
    nodes.forEach(function(n){
      var img=n.querySelector('img');
      var ir=img.getBoundingClientRect();
      var nx=ir.left-mr.left+ir.width/2;
      var ny=ir.top-mr.top+ir.height/2;
      var mx=(cx+nx)/2;
      paths+='<path d="M'+cx+','+cy+' C'+mx+','+cy+' '+mx+','+ny+' '+nx+','+ny+'" fill="none" stroke="#77846A" stroke-width="1.6" stroke-dasharray="2 6" stroke-linecap="round" opacity="0.6"/>';
    });
    lines.innerHTML=paths;
  }
  function init(){
    var imgs=document.querySelectorAll('#tvLangMap .tv-lang-node img');
    var done=0,total=imgs.length;
    imgs.forEach(function(im){
      if(im.complete){done++;}
      else{im.addEventListener('load',function(){done++;if(done>=total)drawLines();});im.addEventListener('error',function(){done++;if(done>=total)drawLines();});}
    });
    drawLines();
    setTimeout(drawLines,300);
  }
  if(document.readyState!=='loading')init();else document.addEventListener('DOMContentLoaded',init);
  window.addEventListener('resize',drawLines);
  window.addEventListener('load',drawLines);
})();
</script>
